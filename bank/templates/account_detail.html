<!DOCTYPE html>
<html>
<head>
    <title>My Account</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .box {
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .info {
            background: #334155;
            padding: 18px;
            border-radius: 12px;
            margin-top: 12px;
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 18px;
        }

        .balance {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            background: #2563eb;
            text-align: center;
        }

        .balance h2 {
            margin: 5px 0;
            font-size: 32px;
        }

        .buttons {
            margin-top: 25px;
            text-align: center;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #475569;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 5px;
        }
        .log{
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #475569;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 5px;
        }

        a:hover {
            background: #64748b;
        }
        .log:hover {
            background: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <h1>My Bank Account</h1>
        <div class="info">
            <div class="label">First Name</div>
            <div class="value">{{ account.first_name }}</div>
        </div>
        <div class="info">
            <div class="label">Last Name</div>
            <div class="value">{{ account.last_name }}</div>
        </div>
        <div class="info">
            <div class="label">Address</div>
            <div class="value">{{ account.address }}</div>
        </div>
        <div class="info">
            <div class="label">Passport ID</div>
            <div class="value">{{ account.passport_id }}</div>
        </div>
        <div class="balance">
            <div>Balance</div>
            <h2>{{ account.balance }}</h2>
        </div>
        <div class="buttons">
            <form method="post" action="{% url 'logout' %}">
            <a href="{% url 'cards' %}">My Cards</a>
            <a href="{% url 'history' %}">History</a>
            <a href="{% url 'transfer' %}">Transfer</a>
            <a href="{% url 'check_phone' %}">Check phone</a>
            <a href="{% url 'check_card' %}">Check card</a>
                {% csrf_token %}
                <button class="log">Logout</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
