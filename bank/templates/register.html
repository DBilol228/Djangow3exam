<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        .box {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            box-sizing: border-box;
            border: none;
            border-radius: 9px;
            background: #334155;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <h1>Create Account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <a class="back" href="{% url 'home' %}"><button>← Back to Home</button></a>
    </div>
</div>
</body>
</html>
