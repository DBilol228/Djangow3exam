<!DOCTYPE html>
<html>
<head>
    <title>Banking System</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 80px auto;
            text-align: center;
        }
        .box {
            background: #1e293b;
            padding: 50px;
            border-radius: 25px;
        }
        h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }
        p {
            color: #94a3b8;
            font-size: 18px;
        }
        .buttons {
            margin-top: 35px;
        }
        a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 14px 28px;
            border-radius: 10px;
            margin: 8px;
        }
        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <h1>Banking System</h1>
        <p>Welcome to your personal banking system</p>
        <div class="buttons">
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        </div>
    </div>
</div>
</body>
</html>
