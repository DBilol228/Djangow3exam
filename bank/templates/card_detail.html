<!DOCTYPE html>
<html>
<head>
    <title>Card Details</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            background: #1e293b;
            padding: 35px;
            border-radius: 22px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .info {
            background: #334155;
            padding: 17px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .value {
            font-size: 18px;
        }

        .balance {
            background: #2563eb;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .balance h2 {
            font-size: 30px;
            margin: 8px 0 0;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #475569;
            padding: 12px 18px;
            border-radius: 9px;
            margin: 5px;
        }

        a:hover {
            background: #64748b;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Card Details</h1>
        <div class="info">
            <div class="label">Card Number</div>
            <div class="value">{{ card.card_number }}</div>
        </div>
        <div class="info">
            <div class="label">CVV</div>
            <div class="value">{{ card.cvv }}</div>
        </div>
        <div class="info">
            <div class="label">Date</div>
            <div class="value">{{ card.date }}</div>
        </div>
        <div class="info">
            <div class="label">Type</div>
            <div class="value">{{ card.type }}</div>
        </div>
        <div class="info">
            <div class="label">PIN</div>
            <div class="value">{{ card.pin }}</div>
        </div>
        <div class="balance">
            <div>Balance</div>
            <h2>{{ card.balance }}</h2>
        </div>
        <div class="buttons">
            <a href="{% url 'card_history' %}?id={{ card.id }}">History</a>
            <a href="{% url 'cards' %}">← Back</a>
        </div>
    </div>
</div>
</body>
</html>
